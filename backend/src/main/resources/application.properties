spring.application.name=chatflow
# Render (and most hosts) inject PORT; fall back to 8080 locally
server.port=${PORT:8080}

# Local development: put secrets in a gitignored .env file next to pom.xml (see README)
spring.config.import=optional:file:.env[.properties]

# Database - set DB_URL / DB_USERNAME / DB_PASSWORD in the environment
# DB_URL must be JDBC format: jdbc:postgresql://<host>:5432/<database>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chatflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT - JWT_SECRET is required (at least 32 characters)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated list of frontend origins allowed to call the API and WebSocket
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://chatflow-frontend-gilt.vercel.app}
