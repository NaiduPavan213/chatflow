# Tests run against an in-memory H2 database, so no Postgres or secrets are needed
spring.datasource.url=jdbc:h2:mem:chatflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=test-only-secret-that-is-at-least-32-bytes-long
jwt.expiration=3600000
app.cors.allowed-origins=http://localhost:5173
